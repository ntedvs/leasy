name: image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "5 10 * * *"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ntedvs/leasy
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build
        run: |
          echo "VERSION=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          podman build --pull=newer -f leasy.containerfile -t leasy \
            --label org.opencontainers.image.title=Leasy \
            --label "org.opencontainers.image.description=Linux, minus the friction." \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$(date +%Y%m%d)-${GITHUB_SHA::7}" \
            .

      - name: Rechunk
        run: |
          podman run --rm --pull=never --privileged \
            --mount=type=image,src=leasy,target=/rpm-ostree \
            --mount=type=bind,src="$(podman info -f '{{.Store.GraphRoot}}')",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            localhost/leasy \
            compose build-chunked-oci --bootc --format-version=2 --max-layers 127 \
            --rootfs /rpm-ostree \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]localhost/leasy"

      - name: Push
        id: push
        if: env.PUBLISH == 'true'
        run: |
          podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          for tag in latest "$VERSION"; do
            podman push --digestfile=digest leasy "$IMAGE:$tag"
          done
          echo "digest=$(<digest)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
        with:
          cosign-release: v3.1.2

      - name: Sign
        if: env.PUBLISH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@${{ steps.push.outputs.digest }}"
